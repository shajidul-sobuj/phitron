<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HSC C Contest</title>
  <link href="/css/styles.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <header class="mb-4">
      <h1 class="h3">Welcome to HSC C Contest</h1>
      <p class="text-muted mb-1">HSC C Programming Practice Contest</p>
      <div class="d-flex gap-3 align-items-center">
        <div>
          <label class="small-muted">Participant</label>
          <div id="participantName" class="fw-bold">-</div>
        </div>
        <div class="ms-auto text-end">
          <div class="small-muted">Timer</div>
          <div id="timerDisplay" class="timer">30:00</div>
        </div>
        <div class="text-end ms-3">
          <div class="small-muted">Score</div>
          <div id="scoreDisplay" class="fw-bold">0</div>
        </div>
      </div>
    </header>

    <main id="app"></main>
    <footer class="mt-4 text-center">Made with ❤️ by Your Name</footer>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
